name: Sign iOS rule catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ios-rules/catalog.json', 'ios-rules/sign.mjs', '.github/workflows/ios-rules-sign.yml']
permissions:
  contents: write
concurrency:
  group: sign-ios-rules
  cancel-in-progress: false
jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Sign and verify
        run: |
          node ios-rules/sign.mjs
          node ios-rules/sign.mjs --verify
        env:
          IOS_RULE_SIGNING_PRIVATE_KEY: ${{ secrets.IOS_RULE_SIGNING_PRIVATE_KEY }}
      - name: Commit signed envelope
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ios-rules/catalog.signed.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update signed iOS rule catalog'
            git push
          fi
